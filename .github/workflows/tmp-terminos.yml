# Temporal: datos para el spec de Jumbo y Pepe Ganga (la red de la sesión no llega). Se borra al terminar.
name: tmp-terminos
on:
  push:
    branches: [claude/project-thread-rlzaur]
    paths: [.github/workflows/tmp-terminos.yml]
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Datos para el spec
        shell: python
        run: |
          import json, re, time, urllib.request
          from collections import Counter
          UA = {"User-Agent": "Mozilla/5.0 (discountZ medicion)", "Accept": "application/json"}
          def get(u, accept="application/json"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={**UA, "Accept": accept}), timeout=60) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, "code", "ERR"), b""
          for host in ["www.jumbocolombia.com", "www.pepeganga.com"]:
              print(f"\n===== {host}")
              s, home = get(f"https://{host}/", "text/html")
              h = home.decode("utf-8", "replace")
              print("home", s, "salesChannel:", Counter(re.findall(r'"salesChannel"\s*:\s*"?(\d+)', h)).most_common(5), "sc=", Counter(re.findall(r'[?&]sc=(\d+)', h)).most_common(5))
              print("account:", Counter(re.findall(r'"account"\s*:\s*"([a-z0-9]+)"', h)).most_common(3), "imghosts:", Counter(re.findall(r'https://([a-z0-9.-]*vtex(?:img|assets)[a-z0-9.-]*)/', h)).most_common(3))
              api = f"https://{host}/api/catalog_system/pub/products/search"
              s, b = get(f"{api}?fq=isAvailablePerSalesChannel_1:1&_from=0&_to=49")
              d = json.loads(b)
              infl = sum(1 for p in d if (o := p["items"][0]["sellers"][0]["commertialOffer"])["Price"] and o["ListPrice"] >= 2 * o["Price"])
              promo = sum(1 for p in d if (o := p["items"][0]["sellers"][0]["commertialOffer"])["ListPrice"] > o["Price"])
              print("muestra", len(d), "ListPrice>Price", promo, "ListPrice>=2x", infl)
              print("sellers", Counter(s2["sellerName"] for p in d for it in p["items"] for s2 in it["sellers"]).most_common(5))
              print("imgs", Counter(re.sub(r"/arquivos.*", "", it["images"][0]["imageUrl"]) for p in d for it in p["items"] if it.get("images")).most_common(3))
              ids = [p["items"][0]["itemId"] for p in d[:10]]
              for sc in ["1", "2", "3"]:
                  q = "&".join(f"fq=skuId:{i}" for i in ids)
                  s, b = get(f"{api}?{q}&sc={sc}&_from=0&_to=9")
                  try:
                      dd = json.loads(b)
                      prices = {p["items"][0]["itemId"]: p["items"][0]["sellers"][0]["commertialOffer"]["Price"] for p in dd}
                  except Exception:
                      prices = {}
                  print(f"sc={sc} status={s} precios={[prices.get(i) for i in ids]}")
                  time.sleep(2)
              for p in d[:2]:
                  print(" link", p.get("link"), "linkText", p.get("linkText"))
