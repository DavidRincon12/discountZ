# Temporal: mide el catálogo VTEX de tiendas candidatas (la red de la sesión no llega). Se borra al terminar.
name: tmp-terminos
on:
  push:
    branches: [claude/project-thread-rlzaur]
    paths: [.github/workflows/tmp-terminos.yml]
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Medir catálogos
        shell: python
        run: |
          import json, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (discountZ medicion)", "Accept": "application/json"}
          def get(u):
              t = time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60) as r:
                      b = r.read()
                      return r.status, dict(r.headers), b, time.monotonic() - t
              except Exception as e:
                  return getattr(e, "code", "ERR"), {}, b"", time.monotonic() - t
          for host in ["www.jumbocolombia.com", "www.pepeganga.com"]:
              api = f"https://{host}/api/catalog_system/pub"
              s, h, b, dt = get(f"{api}/category/tree/1")
              print(f"\n===== {host} tree status={s} {dt:.1f}s")
              cats = json.loads(b) if s == 200 else []
              print("raices:", len(cats), [c["name"] for c in cats][:30])
              for q, name in [("", "todo"), ("&fq=isAvailablePerSalesChannel_1:1", "con_stock")]:
                  s, h, b, dt = get(f"{api}/products/search?_from=0&_to=49{q}")
                  res = {k.lower(): v for k, v in h.items()}.get("resources")
                  print(f"{name}: status={s} resources={res} bytes={len(b)} {dt:.1f}s")
                  time.sleep(2)
              if s == 200 and b:
                  d = json.loads(b)
                  conl = sum(1 for p in d if p["items"] and p["items"][0]["sellers"] and p["items"][0]["sellers"][0]["commertialOffer"]["ListPrice"] > p["items"][0]["sellers"][0]["commertialOffer"]["Price"])
                  sellers = {s2["sellerName"] for p in d for it in p["items"] for s2 in it["sellers"]}
                  print("muestra:", len(d), "con ListPrice>Price:", conl, "vendedores:", sorted(sellers)[:10])
                  for p in d[:3]:
                      o = p["items"][0]["sellers"][0]["commertialOffer"]
                      print(" -", p["productName"][:50], o["Price"], o["ListPrice"], o.get("AvailableQuantity"))
              for c in cats[:40]:
                  s, h, b, dt = get(f"{api}/products/search?fq=C:/{c['id']}/&fq=isAvailablePerSalesChannel_1:1&_from=0&_to=0")
                  res = {k.lower(): v for k, v in h.items()}.get("resources")
                  print(f"  cat {c['name'][:30]}: status={s} resources={res}")
                  time.sleep(1)
