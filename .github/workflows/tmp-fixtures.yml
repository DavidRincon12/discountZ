# Temporal: graba las fixtures reales de Woot con la clave de Actions (la nube de la sesión no
# la tiene; autorizado por David el 2026-10-28). Sube las fixtures a la rama y se borra después.
name: tmp-fixtures
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-fixtures.yml]
permissions:
  contents: write
jobs:
  grabar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          version-file: pyproject.toml
          python-version: '3.13'
      - run: uv sync --locked --no-dev
      - name: Grabar
        env:
          DISCOUNTZ_WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import json, os, sys, time
          from collections import Counter
          from datetime import UTC, datetime
          from decimal import Decimal
          from urllib.parse import urlsplit
          from discountz.infra.http import HttpxClient
          from discountz.sources.fixtures import FIXTURES_DIR, save_fixture

          key = os.environ["DISCOUNTZ_WOOT_API_KEY"]
          if not key:
              sys.exit("falta WOOT_API_KEY")
          headers = {"Accept": "application/json", "x-api-key": key}
          today = datetime.now(UTC).date().isoformat()
          client = HttpxClient("woot")
          try:
              for feed in ("Computers", "Electronics", "Tools"):
                  resp = client.request("GET", f"https://developer.woot.com/feed/{feed}", headers=headers)
                  print(f"== {feed}: HTTP {resp.status}, {len(resp.body)} bytes, {resp.elapsed_ms} ms")
                  if resp.status != 200:
                      sys.exit(f"{feed}: HTTP {resp.status}")
                  data = json.loads(resp.body, parse_float=Decimal)
                  items = data.get("Items") or []
                  print("claves de la página:", sorted(data))
                  print("ítems:", len(items), "| claves de un ítem:", sorted(items[0]) if items else "-")
                  for field in ("Condition", "IsSoldOut", "IsAvailableOnMobileAppOnly", "Site"):
                      print(field, dict(Counter(str(i.get(field)) for i in items)))
                  print("hosts Url:", dict(Counter(urlsplit(str(i.get("Url"))).netloc for i in items)))
                  print("hosts Photo:", dict(Counter(urlsplit(str(i.get("Photo"))).netloc for i in items)))
                  print("categorías:", dict(Counter(c for i in items for c in (i.get("Categories") or [])).most_common(15)))
                  print("rangos de precio:", sum(1 for i in items if (i.get("SalePrice") or {}).get("Minimum") != (i.get("SalePrice") or {}).get("Maximum")))
                  path = save_fixture(FIXTURES_DIR, "woot", feed.lower(), resp, recorded_at=today)
                  print("guardada:", path.name, path.stat().st_size, "bytes")
                  time.sleep(1.5)  # la API admite 1 petición por segundo
          finally:
              client.close()
          PY
      - name: Subir a la rama
        run: |
          set -euo pipefail
          git config user.name "David Santiago Rincón Bautista"
          git config user.email "davidsantiagorb@ufps.edu.co"
          git add tests/fixtures/woot/
          git commit -m "test(woot): graba los feeds reales de Computers, Electronics y Tools"
          git push origin HEAD:claude/project-thread-xsztn5
