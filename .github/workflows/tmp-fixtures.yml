# Temporal: graba las fixtures de Jumbo y Pepe Ganga (la red de la sesión no llega). Sube las fixtures a la rama (autorizado por David); se borra después.
name: tmp-fixtures
on:
  push:
    branches: [claude/project-thread-rlzaur]
    paths: [.github/workflows/tmp-fixtures.yml]
permissions:
  contents: write
jobs:
  grabar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: pyproject.toml
          python-version: '3.13'
      - run: uv sync --locked --no-dev
      - name: Grabar
        run: |
          set -euo pipefail
          rec() { uv run --no-sync python -m discountz record-fixture "$1" "$2" "$3" --folder vtex ${4:+--post-json "$4"}; }
          for spec in "jumbo https://www.jumbocolombia.com/api televisor" "pepeganga https://www.pepeganga.com/api lego"; do
            set -- $spec; code=$1; api=$2; q=$3
            rec $code $code-category-tree "$api/catalog_system/pub/category/tree/1"
            root=$(gzip -dc tests/fixtures/vtex/$code-category-tree.json.gz | jq -r '[.[] | select(.hasChildren)][0].id')
            rec $code $code-catalog "$api/catalog_system/pub/products/search?fq=C:/$root/&fq=isAvailablePerSalesChannel_1:1&_from=0&_to=9"
            rec $code ${code}_busqueda_$q "$api/catalog_system/pub/products/search?ft=$q&_from=0&_to=9"
            b=tests/fixtures/vtex/${code}_busqueda_$q.json.gz
            pick=$(gzip -dc $b | jq -r '([.[] | select(any(.items[0].sellers[]; .sellerId != "1"))] + .)[0] | [.linkText, .items[0].itemId, (.items[0].sellers | map(select(.commertialOffer.AvailableQuantity > 0))[0].sellerId // "1")] | @tsv')
            slug=$(cut -f1 <<<"$pick"); sku=$(cut -f2 <<<"$pick"); seller=$(cut -f3 <<<"$pick")
            echo "ficha $code: slug=$slug sku=$sku seller=$seller"
            rec $code ${code}_ficha_$sku "$api/catalog_system/pub/products/search/$slug/p"
            rec $code ${code}_simulacion_$sku "$api/checkout/pub/orderForms/simulation?sc=1" "{\"items\": [{\"id\": \"$sku\", \"quantity\": 1, \"seller\": \"$seller\"}], \"country\": \"COL\"}"
            sleep 2
          done
          ls -la tests/fixtures/vtex/ | grep -E "jumbo|pepeganga"
          git config user.name "David Santiago Rincón Bautista"
          git config user.email "davidsantiagorb@ufps.edu.co"
          git add tests/fixtures/vtex/jumbo* tests/fixtures/vtex/pepeganga*
          git commit -m "test(vtex): fixtures reales de Jumbo y Pepe Ganga"
          git push origin HEAD:claude/project-thread-rlzaur
