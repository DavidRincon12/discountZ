name: migrate
# Manual y con aprobación: es el ÚNICO workflow que aplica DDL (spec §7.6).
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Versión destino (número entero; "head" = última)'
        required: true
        default: 'head'
permissions:
  contents: read
concurrency:
  group: discountz-migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-db       # revisor obligatorio: David aprueba cada migración
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: pyproject.toml
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - name: Migrar
        # El input va por variable de entorno, nunca interpolado en el script.
        run: uv run --no-sync python -m discountz migrate --to "$TARGET" --wait-lease 20m
        env:
          TARGET: ${{ inputs.to }}
          DISCOUNTZ_MIGRATOR_DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATOR }}
          DISCOUNTZ_GH_RUN_ID: ${{ github.run_id }}
