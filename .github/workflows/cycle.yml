name: cycle
on:
  schedule:
    - cron: '7,37 * * * *'           # respaldo cada 30 min; el disparo principal es externo (spec §6.1)
  workflow_dispatch:                 # cron-job.org lo llama cada 5 min
permissions:
  contents: read
concurrency:
  group: discountz-cycle
  cancel-in-progress: false          # nunca matar un ciclo a mitad; GitHub deja 1 pendiente
jobs:
  cycle:
    # Interruptor de producción: sin la variable `DISCOUNTZ_ACTIVO=true` el ciclo se omite.
    if: vars.DISCOUNTZ_ACTIVO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15              # plazo blando 480 s, duro 12 min; lease TTL 16 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          version-file: pyproject.toml
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - name: Ciclo
        run: uv run --no-sync python -m discountz run
        env:
          DISCOUNTZ_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCOUNTZ_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCOUNTZ_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCOUNTZ_TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          DISCOUNTZ_TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCOUNTZ_HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          DISCOUNTZ_GH_RUN_ID: ${{ github.run_id }}
          DISCOUNTZ_GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          DISCOUNTZ_TRIGGER: ${{ github.event_name }}
          DISCOUNTZ_SOFT_DEADLINE_S: '480'
          # EE. UU. (spec del rastreo §4.5): sin la clave, bestbuy_us debe quedar apagada; sin los 4
          # de Walmart, walmart_us usa el HTML de la v1.
          DISCOUNTZ_BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          DISCOUNTZ_WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          DISCOUNTZ_WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION }}
          DISCOUNTZ_WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
          DISCOUNTZ_WALMART_PUBLISHER_ID: ${{ secrets.WALMART_PUBLISHER_ID }}
          DISCOUNTZ_EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          DISCOUNTZ_EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          DISCOUNTZ_WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
          DISCOUNTZ_MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          DISCOUNTZ_MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
