name: ebay-probe
# Prueba temporal de la Browse API de eBay antes de diseñar la fuente: pide un token OAuth
# (client credentials) y hace dos búsquedas. Nunca imprime el token ni las claves.
# Se borra cuando la fuente de eBay exista.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-onaeks]
    paths: [.github/workflows/ebay-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Token OAuth
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$EBAY_APP_ID" ] || [ -z "$EBAY_CERT_ID" ]; then
            echo "Faltan los secretos EBAY_APP_ID o EBAY_CERT_ID"; exit 1
          fi
          # Diagnóstico sin revelar las claves: forma esperada y espacios sobrantes.
          forma() { [[ $2 =~ $3 ]] && echo "$1: forma OK" || echo "$1: forma inesperada"; }
          forma EBAY_APP_ID "$EBAY_APP_ID" '^[A-Za-z0-9]+-[A-Za-z0-9]+-PRD-[0-9a-f]+-[0-9a-f]+$'
          forma EBAY_CERT_ID "$EBAY_CERT_ID" '^PRD-[0-9a-f]+-[0-9a-f]+(-[0-9a-f]+)*$'
          [[ "$EBAY_APP_ID$EBAY_CERT_ID" =~ [[:space:]] ]] && echo "hay espacios o saltos de línea" || true
          code=$(curl -sS -o token.json -w '%{http_code}' --max-time 20 \
            -u "$EBAY_APP_ID:$EBAY_CERT_ID" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=client_credentials' \
            --data-urlencode 'scope=https://api.ebay.com/oauth/api_scope' \
            https://api.ebay.com/identity/v1/oauth2/token)
          echo "token: HTTP $code"
          if [ "$code" != 200 ]; then jq -c '{error, error_description}' token.json; exit 1; fi
          token=$(jq -r .access_token token.json)
          echo "::add-mask::$token"
          echo "vence en: $(jq .expires_in token.json) s"
          echo "EBAY_TOKEN=$token" >> "$GITHUB_ENV"
          rm token.json
      - name: Grabar fixtures (temporal)
        run: |
          set -euo pipefail
          api=https://api.ebay.com
          H=(-H 'X-EBAY-C-MARKETPLACE-ID: EBAY_US' -H 'X-EBAY-C-ENDUSERCTX: contextualLocation=country%3DUS%2Czip%3D33166')
          F='conditions:{NEW},buyingOptions:{FIXED_PRICE},deliveryCountry:US,price:[15..],priceCurrency:USD'
          # Sin los campos que el adaptador no lee (descripciones, fotos extra, impuestos).
          dump() { echo "==FIXTURE $1 $2=="; jq -c 'walk(if type == "object" then del(.description, .shortDescription, .additionalImages, .thumbnailImages, .localizedAspects, .returnTerms, .paymentMethods, .taxes, .itemHref, .itemAffiliateWebUrl, .leafCategoryIds, .shipToLocations, .primaryProductReviewRating, .estimatedAvailabilities[]?.availabilityThresholdType) else . end)' "$3"; }
          get() { curl -sS -o "$2" -w '%{http_code}' --max-time 60 -G -H "Authorization: Bearer $EBAY_TOKEN" "${H[@]}" "${@:3}" "$1"; }
          c=$(get $api/buy/browse/v1/item_summary/search cat.json --data-urlencode category_ids=27386 --data-urlencode "filter=$F" --data-urlencode limit=6); dump search-category $c cat.json
          c=$(get $api/buy/browse/v1/item_summary/search q.json --data-urlencode 'q=rtx 4070' --data-urlencode "filter=$F" --data-urlencode limit=3); dump search-query $c q.json
          c=$(get $api/buy/browse/v1/item_summary/search shoes.json --data-urlencode category_ids=15709 --data-urlencode "filter=$F" --data-urlencode limit=50)
          var=$(jq -r '[.itemSummaries[] | select(.itemId | test("\\|0$") | not) | .itemId][0]' shoes.json)
          ids="$(jq -r '[.itemSummaries[0:1][].itemId] | join(",")' cat.json),$var,v1|111111111111|0"
          echo "ids pedidos: $ids"
          c=$(get $api/buy/browse/v1/item/ bulk.json --data-urlencode "item_ids=$ids"); dump items-bulk $c bulk.json
          one=$(jq -r '.itemSummaries[0].itemId' cat.json)
          c=$(get "$api/buy/browse/v1/item/$(jq -rn --arg v "$one" '$v|@uri')" one.json); dump item-single $c one.json
          c=$(curl -sS -o bad.json -w '%{http_code}' --max-time 30 -G -H "Authorization: Bearer invalido" "${H[@]}" --data-urlencode q=tv $api/buy/browse/v1/item_summary/search); dump error-401 $c bad.json
          get $api/commerce/taxonomy/v1/category_tree/0 tree.json > /dev/null
          jq -c '{categoryTreeId, categoryTreeVersion, rootCategoryNode: {category: .rootCategoryNode.category, childCategoryTreeNodes: [.rootCategoryNode.childCategoryTreeNodes[]
              | select(.category.categoryId == "1" or .category.categoryId == "293" or .category.categoryId == "11232" or .category.categoryId == "15032")
              | .childCategoryTreeNodes |= (.[0:4] | map(if .childCategoryTreeNodes then .childCategoryTreeNodes |= (.[0:3] | map(del(.childCategoryTreeNodes))) else . end))]}}' tree.json > small.json
          dump taxonomy 200 small.json
