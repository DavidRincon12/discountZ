# Temporal: averigua por qué el catálogo de Mercado Libre no trae precios. Se borra en el commit siguiente.
name: tmp-meli
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-meli.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prueba la API
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error

          API = "https://api.mercadolibre.com"

          def call(method, path, token=None, data=None):
              req = urllib.request.Request(API + path, method=method, data=data)
              req.add_header("Accept", "application/json")
              req.add_header("User-Agent", "discountZ/1.0 (monitor personal de precios)")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              if data:
                  req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200].decode("utf-8", "replace")
              finally:
                  time.sleep(0.4)

          form = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": os.environ["MELI_CLIENT_ID"],
              "client_secret": os.environ["MELI_CLIENT_SECRET"],
          }).encode()
          st, tok = call("POST", "/oauth/token", data=form)
          if st != 200:
              print("TOKEN", st, tok)
              raise SystemExit(1)
          print("SCOPE:", tok.get("scope"))
          token = tok["access_token"]

          def get(path):
              return call("GET", path, token)

          def err(body):
              return body if isinstance(body, str) else ""

          # Búsqueda por EAN (GTIN) del producto con vendedores
          st, p = get("/products/MCO18924972")
          gtins = [v.get("name") for a in (p.get("attributes") or []) if a.get("id") == "GTIN" for v in (a.get("values") or [])]
          print("GTIN de MCO18924972:", gtins)
          for g in gtins[:1]:
              st, b = get(f"/products/search?status=active&site_id=MCO&product_identifier={g}")
              print("  por GTIN:", st, err(b), [r["id"] for r in b.get("results", [])] if isinstance(b, dict) else "")

          # Barrido con palabra y dominio: ¿cuántos productos tienen vendedores?
          for q, domain in (("taladro", "MCO-ELECTRIC_DRILLS"), ("televisor", "MCO-TELEVISIONS"), ("portatil", "MCO-NOTEBOOKS")):
              st, body = get(f"/products/search?status=active&site_id=MCO&q={q}&domain_id={domain}&limit=50")
              print(f"\n{q} / {domain}: {st} {err(body)}")
              if st != 200:
                  continue
              res = body.get("results", [])
              print("  total:", body.get("paging", {}).get("total"), "en esta página:", len(res), "dominios:", sorted({r.get("domain_id") for r in res}))
              t0, hits, offs, prices = time.time(), 0, 0, []
              for r in res:
                  st2, its = get(f"/products/{r['id']}/items")
                  rs = its.get("results", []) if st2 == 200 else []
                  if rs:
                      hits += 1
                      low = min(rs, key=lambda i: i["price"])
                      offs += bool(low.get("original_price"))
                      prices.append((r["id"], low["price"], low.get("original_price"), len(rs), r.get("name", "")[:40]))
              print(f"  con vendedores: {hits}/{len(res)}, con precio de antes: {offs}, {time.time() - t0:.0f} s")
              for x in prices[:4]:
                  print("   ", x)
              for off in (950, 1000, 5000):
                  st3, b3 = get(f"/products/search?status=active&site_id=MCO&q={q}&domain_id={domain}&limit=50&offset={off}")
                  print(f"  offset {off}: {st3} {err(b3)[:120]} n={len(b3.get('results', [])) if isinstance(b3, dict) else 0}")
