# Temporal: prueba si la API de Mercado Libre responde con el token de la app (intento 3). Se borra después.
name: tmp-meli
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-meli.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prueba la API
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error

          API = "https://api.mercadolibre.com"

          def call(method, path, token=None, data=None):
              req = urllib.request.Request(API + path, method=method, data=data)
              req.add_header("Accept", "application/json")
              req.add_header("User-Agent", "discountZ/1.0 (monitor personal de precios)")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              if data:
                  req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode("utf-8", "replace")
                  return e.code, body
              finally:
                  time.sleep(0.5)

          cid = os.environ["MELI_CLIENT_ID"]
          print("client_id presente:", bool(cid), "secret presente:", bool(os.environ["MELI_CLIENT_SECRET"]))
          form = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": cid,
              "client_secret": os.environ["MELI_CLIENT_SECRET"],
          }).encode()
          st, tok = call("POST", "/oauth/token", data=form)
          if st != 200:
              print("TOKEN", st, tok)
              raise SystemExit(1)
          print("TOKEN 200 campos:", sorted(tok), "expires_in:", tok.get("expires_in"), "scope:", tok.get("scope"))
          token = tok["access_token"]

          def show(label, path, auth=True):
              st, body = call("GET", path, token if auth else None)
              short = body if isinstance(body, str) else ""
              print(f"{label}: {st} {short}")
              return st, body

          import collections
          for q in ("portatil lenovo", "televisor samsung", "taladro inalambrico"):
              st, body = show(f"products/search {q}", "/products/search?status=active&site_id=MCO&q=" + urllib.parse.quote(q) + "&limit=50")
              if st != 200:
                  continue
              res = body.get("results", [])
              keys = sorted(res[0]) if res else []
              print("  campos del resultado:", keys)
              wins, offs, stores, sample = 0, 0, collections.Counter(), None
              for r in res[:40]:
                  st2, prod = call("GET", f"/products/{r['id']}", token)
                  bw = (prod.get("buy_box_winner") if st2 == 200 else None) or {}
                  if bw:
                      wins += 1
                      offs += bool(bw.get("original_price"))
                      stores[bool(bw.get("official_store_id"))] += 1
                      sample = sample or (r["id"], bw.get("item_id"), bw.get("price"), bw.get("original_price"), bw.get("currency_id"), bw.get("condition"), sorted(bw)[:30])
              print(f"  {q}: {wins}/40 con buy_box_winner, {offs} con precio de antes, tienda oficial {dict(stores)}")
              print("  ejemplo:", sample)
              if sample:
                  st3, items = show("  items del producto", f"/products/{sample[0]}/items")
                  if st3 == 200:
                      print("   n=", len(items.get("results", [])), "campos", sorted(items["results"][0])[:30])
                  show("  items/{id}", f"/items/{sample[1]}")
                  show("  items?ids=", f"/items?ids={sample[1]}")
                  show("  sale_price", f"/items/{sample[1]}/sale_price")
