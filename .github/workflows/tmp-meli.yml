# Temporal: averigua por qué el catálogo de Mercado Libre no trae precios. Se borra en el commit siguiente.
name: tmp-meli
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-meli.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prueba la API
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error

          API = "https://api.mercadolibre.com"

          def call(method, path, token=None, data=None):
              req = urllib.request.Request(API + path, method=method, data=data)
              req.add_header("Accept", "application/json")
              req.add_header("User-Agent", "discountZ/1.0 (monitor personal de precios)")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              if data:
                  req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:200].decode("utf-8", "replace")
              finally:
                  time.sleep(0.4)

          form = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": os.environ["MELI_CLIENT_ID"],
              "client_secret": os.environ["MELI_CLIENT_SECRET"],
          }).encode()
          st, tok = call("POST", "/oauth/token", data=form)
          if st != 200:
              print("TOKEN", st, tok)
              raise SystemExit(1)
          print("SCOPE:", tok.get("scope"))
          token = tok["access_token"]

          def get(path):
              return call("GET", path, token)

          def err(body):
              return body if isinstance(body, str) else ""

          # 1. Productos con página /p/ en la web (tienen vendedores)
          item_ids = []
          for pid in ("MCO18924972", "MCO19687218"):
              st, p = get(f"/products/{pid}")
              print(f"\nproducts/{pid}: {st} {err(p)}")
              if st == 200:
                  bw = p.get("buy_box_winner")
                  print("  status:", p.get("status"), "| buy_box_winner:", None if bw is None else {k: bw.get(k) for k in ("item_id", "price", "original_price", "currency_id", "official_store_id", "condition")})
                  print("  campos con precio o ganador:", [k for k in p if any(w in k for w in ("price", "buy_box", "winner", "item"))])
                  print("  parent_id:", p.get("parent_id"), "children:", len(p.get("children_ids") or []))
              st, its = get(f"/products/{pid}/items")
              print(f"products/{pid}/items: {st} {err(its)}")
              if st == 200:
                  rs = its.get("results", [])
                  print("  n =", len(rs), "| paging:", its.get("paging"))
                  for i in rs[:5]:
                      print("   ", {k: i.get(k) for k in ("item_id", "price", "original_price", "currency_id", "official_store_id", "condition", "listing_type_id")})
                  if rs:
                      print("  campos:", sorted(rs[0]))
                  item_ids += [i["item_id"] for i in rs[:3]]

          # 2. Fichas de los vendedores
          for iid in item_ids[:2]:
              for path in (f"/items/{iid}", f"/items/{iid}/sale_price", f"/items/{iid}/prices"):
                  st, b = get(path)
                  extra = {k: b.get(k) for k in ("price", "original_price", "amount", "regular_amount", "status", "catalog_product_id")} if isinstance(b, dict) else err(b)
                  print(f"{path}: {st} {extra}")
          if item_ids:
              ids = ",".join(item_ids[:3])
              st, b = get(f"/items?ids={ids}&attributes=id,price,original_price,status,catalog_product_id")
              print(f"items?ids: {st} {b if isinstance(b, list) else err(b)}")

          # 3. Más vendidos y tendencias (permiso «Métricas del negocio»)
          for path in ("/highlights/MCO/category/MCO1648", "/highlights/MCO/category/MCO1000", "/trends/MCO"):
              st, b = get(path)
              n = len(b.get("content", [])) if isinstance(b, dict) else (len(b) if isinstance(b, list) else 0)
              sample = b.get("content", [])[:3] if isinstance(b, dict) else (b[:2] if isinstance(b, list) else err(b))
              print(f"{path}: {st} n={n} {sample}")

          # 4. Búsqueda por modelo: ¿los hijos o los padres tienen ganador?
          st, body = get("/products/search?status=active&site_id=MCO&q=" + urllib.parse.quote("dewalt dcd7781") + "&limit=20")
          print(f"\nproducts/search dewalt dcd7781: {st} {err(body)}")
          if st == 200:
              for r in body.get("results", [])[:10]:
                  st2, p = get(f"/products/{r['id']}")
                  bw = p.get("buy_box_winner") if st2 == 200 else "?"
                  print(f"  {r['id']} hijos={len(r.get('children_ids') or [])} padre={r.get('parent_id')} ganador={'sí' if bw else 'no'} {r.get('name', '')[:60]}")
