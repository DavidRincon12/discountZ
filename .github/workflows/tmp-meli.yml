# Temporal: mide lo que falta para diseñar Mercado Libre (EAN, paginación, vendedor, enlace y foto). Se borra en el commit siguiente.
name: tmp-meli
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-meli.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prueba la API
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error

          API = "https://api.mercadolibre.com"
          UA = "discountZ/1.0 (monitor personal de precios)"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          plain = urllib.request.build_opener(NoRedirect)

          def call(method, url, token=None, data=None, raw=False):
              req = urllib.request.Request(url if url.startswith("http") else API + url, method=method, data=data)
              req.add_header("User-Agent", UA)
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              if data:
                  req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with plain.open(req, timeout=20) as r:
                      body = r.read()
                      return r.status, dict(r.headers), (body if raw else json.loads(body or b"null"))
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()[:160].decode("utf-8", "replace")
              finally:
                  time.sleep(0.4)

          form = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": os.environ["MELI_CLIENT_ID"],
              "client_secret": os.environ["MELI_CLIENT_SECRET"],
          }).encode()
          st, _, tok = call("POST", "/oauth/token", data=form)
          if st != 200:
              print("TOKEN", st, tok)
              raise SystemExit(1)
          token = tok["access_token"]

          def get(path):
              st, headers, body = call("GET", path, token)
              return st, headers, body

          # 1. Cabeceras de cuota
          st, headers, prod = get("/products/MCO18924972")
          print("cabeceras de cuota:", {k: v for k, v in headers.items() if "limit" in k.lower() or "rate" in k.lower() or "retry" in k.lower()})
          pics = prod.get("pictures") or []
          print("producto: nombre:", (prod.get("name") or "")[:50], "| fotos:", len(pics), "| url foto:", (pics[0].get("url") if pics else None), "| secure:", (pics[0].get("secure_url") if pics else None), "| permalink:", prod.get("permalink"))
          print("  claves:", sorted(prod))

          # 2. Detalle útil de los vendedores
          st, _, its = get("/products/MCO18924972/items")
          rs = its.get("results", []) if st == 200 else []
          for i in rs[:4]:
              print("  vendedor:", {k: i.get(k) for k in ("price", "official_store_id", "tier", "tags", "deal_ids", "international_delivery_mode")}, "envío:", {k: (i.get("shipping") or {}).get(k) for k in ("free_shipping", "logistic_type", "mode")})
          if rs:
              sid = rs[0]["seller_id"]
              st, _, u = get(f"/users/{sid}")
              rep = (u.get("seller_reputation") or {}) if isinstance(u, dict) else {}
              print("users/{vendedor}:", st, (u if isinstance(u, str) else ""), "| claves:", sorted(u)[:25] if isinstance(u, dict) else "", "| reputación:", {k: rep.get(k) for k in ("level_id", "power_seller_status")})

          # 3. Enlace y foto (una petición a cada uno)
          for url in ("https://www.mercadolibre.com.co/p/MCO18924972", "https://articulo.mercadolibre.com.co/MCO-3173845424"):
              st, h, _ = call("GET", url, raw=True)
              print("enlace", url, "->", st, h.get("Location") or h.get("location"))
          if pics:
              for u in (pics[0].get("secure_url"), pics[0].get("url")):
                  if u:
                      st, h, b = call("GET", u, raw=True)
                      print("foto", urllib.parse.urlsplit(u).scheme, urllib.parse.urlsplit(u).hostname, "->", st, h.get("Content-Type"), len(b) if isinstance(b, bytes) else b)

          # 4. Búsqueda por EAN
          eans = ["0195950637151", "8806099448523", "8806097978305", "6921732899394", "6942351427751", "0887276404288",
                  "0619659165239", "0740617344806", "0649528787682", "8806096621363", "6938187386058", "6936718340487",
                  "1200130024191", "850049670821", "4711387569504", "194644388898", "199275960147", "6921732899332"]
          found = with_sellers = 0
          for e in eans:
              hit = None
              for variant in dict.fromkeys((e, e.lstrip("0"))):
                  st, _, b = get(f"/products/search?status=active&site_id=MCO&product_identifier={variant}")
                  ids = [r["id"] for r in b.get("results", [])] if isinstance(b, dict) else []
                  if st != 200:
                      print("  EAN", variant, st, b)
                  if ids:
                      hit = ids
                      break
              sellers = 0
              if hit:
                  found += 1
                  st, _, it = get(f"/products/{hit[0]}/items")
                  sellers = len(it.get("results", [])) if st == 200 else 0
                  with_sellers += sellers > 0
              print(f"  EAN {e}: productos {hit} vendedores {sellers}")
          print(f"EAN: {found}/{len(eans)} encontrados, {with_sellers} con vendedores")

          # 5. Tope de paginación y enumeración por atributos
          for off in (300, 450, 600, 850, 900):
              st, _, b = get(f"/products/search?status=active&site_id=MCO&q=televisor&domain_id=MCO-TELEVISIONS&limit=50&offset={off}")
              print(f"offset {off}: {st} n={len(b.get('results', [])) if isinstance(b, dict) else b}")
          for extra in ("attributes=BRAND:Samsung", "BRAND=Samsung", "attributes=BRAND%3D9344"):
              st, _, b = get(f"/products/search?status=active&site_id=MCO&domain_id=MCO-TELEVISIONS&{extra}&limit=5")
              print(f"atributos {extra}: {st} total={b.get('paging', {}).get('total') if isinstance(b, dict) else b}")
