# Temporal: prueba si la API de Mercado Libre responde con el token de la app (intento 3). Se borra después.
name: tmp-meli
on:
  push:
    branches: [claude/project-thread-xsztn5]
    paths: [.github/workflows/tmp-meli.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prueba la API
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error

          API = "https://api.mercadolibre.com"

          def call(method, path, token=None, data=None):
              req = urllib.request.Request(API + path, method=method, data=data)
              req.add_header("Accept", "application/json")
              req.add_header("User-Agent", "discountZ/1.0 (monitor personal de precios)")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              if data:
                  req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode("utf-8", "replace")
                  return e.code, body
              finally:
                  time.sleep(0.5)

          cid = os.environ["MELI_CLIENT_ID"]
          print("client_id presente:", bool(cid), "secret presente:", bool(os.environ["MELI_CLIENT_SECRET"]))
          form = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": cid,
              "client_secret": os.environ["MELI_CLIENT_SECRET"],
          }).encode()
          st, tok = call("POST", "/oauth/token", data=form)
          if st != 200:
              print("TOKEN", st, tok)
              raise SystemExit(1)
          print("TOKEN 200 campos:", sorted(tok), "expires_in:", tok.get("expires_in"), "scope:", tok.get("scope"))
          token = tok["access_token"]

          def show(label, path, auth=True):
              st, body = call("GET", path, token if auth else None)
              short = body if isinstance(body, str) else ""
              print(f"{label}: {st} {short}")
              return st, body

          show("users/me", "/users/me")
          show("users/id", f"/users/{tok.get('user_id')}")
          show("categories", "/categories/MCO1648")
          show("sites/MCO sin token", "/sites/MCO", auth=False)
          show("sites/MCO", "/sites/MCO")
          show("search q", "/sites/MCO/search?q=portatil&limit=5")
          show("highlights", "/highlights/MCO/category/MCO1648")
          show("domain_discovery", "/sites/MCO/domain_discovery/search?q=portatil&limit=3")

          total = 0
          for q in ("portatil", "televisor", "taladro"):
              st, body = show(f"products/search {q}", f"/products/search?status=active&site_id=MCO&q={q}&limit=50")
              if st != 200:
                  continue
              res = body.get("results", [])
              total += len(res)
              domains = sorted({r.get("domain_id") for r in res})
              print(f"  {q}: {len(res)} de {body.get('paging', {}).get('total')} dominios {domains[:5]}")
              with_winner = 0
              for r in res[:3]:
                  pid = r["id"]
                  st2, prod = show(f"  products/{pid}", f"/products/{pid}")
                  if st2 == 200:
                      bw = prod.get("buy_box_winner") or {}
                      pics = prod.get("pictures") or []
                      host = urllib.parse.urlsplit(pics[0]["url"]).hostname if pics else None
                      link = urllib.parse.urlsplit(prod.get("permalink") or "").hostname
                      print(f"    winner={bool(bw)} price={bw.get('price')} orig={bw.get('original_price')} cur={bw.get('currency_id')} "
                            f"official={bw.get('official_store_id')} cond={bw.get('condition')} foto={host} enlace={link}")
                      with_winner += bool(bw)
                  st3, items = show(f"  products/{pid}/items", f"/products/{pid}/items")
                  if st3 == 200:
                      rs = items.get("results", [])
                      print(f"    items={len(rs)} precios={[i.get('price') for i in rs[:3]]} tiendas={[i.get('official_store_id') for i in rs[:3]]}")
                      if rs:
                          show(f"    items/{rs[0]['item_id']}", f"/items/{rs[0]['item_id']}")
              print(f"  {q}: {with_winner}/3 con buy_box_winner")
          print("TOTAL productos:", total)
