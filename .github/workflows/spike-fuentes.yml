# Workflow DESECHABLE del spike de fuentes: se borra en el commit siguiente a leer sus resultados.
name: spike-fuentes
on:
  push:
    branches: [claude/magical-gauss-atp26y]
    paths: [spike/**, .github/workflows/spike-fuentes.yml]
permissions:
  contents: read
concurrency:
  group: spike-fuentes
  cancel-in-progress: true
jobs:
  sonda:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install curl_cffi==0.16.3 httpx==0.28.1
      - run: python spike/sonda_fuentes.py --run ${{ matrix.run }} --out resultado-${{ matrix.run }}.json
