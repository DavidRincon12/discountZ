# Temporal: sondeo de solo lectura (GET) desde Actions de Homecenter, Falabella y tiendas VTEX candidatas.
# Usa el cliente HTTP de producción (mismas cabeceras, sin redirecciones), una petición cada 3 s, sin BD ni secretos.
# Un bloqueo o un desafío descarta la fuente: no se esquiva. No se fusiona a main; se borra en el siguiente commit.
name: tmp-sondeo-tiendas
on:
  push:
    branches: [claude/project-thread-0y36d9]
    paths: [.github/workflows/tmp-sondeo-tiendas.yml]
permissions:
  contents: read
jobs:
  sondear:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: pyproject.toml
          python-version: '3.13'
      - run: uv sync --locked --no-dev
      - name: Sondear
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import urlsplit

          from discountz.infra.http import CATALOG_MAX_BODY_BYTES, HttpxClient

          PAUSE_S = 3.0
          NEXT = re.compile(rb'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', re.S)
          MARKS = re.compile(
              r"captcha|cf-chl|just a moment|access denied|px-captcha|datadome|attention required|verify you are human",
              re.I,
          )
          PLATFORMS = ("vtex", "shopify", "woocommerce", "wp-content", "magento", "prestashop", "blacksip", "existaya", "__next")
          client = HttpxClient("sondeo", max_body=CATALOG_MAX_BODY_BYTES)
          summary: list[str] = []


          def head(body: bytes, n: int = 240) -> str:
              text = re.sub(r"<[^>]+>", " ", body[:20000].decode("utf-8", "replace"))
              return " ".join(text.split())[:n]


          def get(label: str, url: str, headers: dict[str, str] | None = None):
              """GET con el cliente de producción; imprime estado, tamaño y tiempo, nunca el cuerpo."""
              time.sleep(PAUSE_S)
              parts = urlsplit(url)
              where = f"{parts.netloc}{parts.path}" + ("?…" if parts.query else "")
              try:
                  r = client.request("GET", url, headers=headers)
              except Exception as exc:  # sondeo desechable: se informa cualquier fallo y se sigue
                  print(f"[{label}] ERROR {type(exc).__name__}: {exc} ({where})", flush=True)
                  summary.append(f"{label}: ERROR {type(exc).__name__}")
                  return None
              h = {k.lower(): v for k, v in r.headers.items()}
              marks = sorted({m.lower() for m in MARKS.findall(r.body[:300000].decode("utf-8", "replace"))})
              print(
                  f"[{label}] {r.status} {where} bytes={len(r.body)} ms={r.elapsed_ms} server={h.get('server')} "
                  f"cf_cache={h.get('cf-cache-status')} ctype={h.get('content-type')} location={h.get('location')} "
                  f"retry_after={h.get('retry-after')} marcas={marks}",
                  flush=True,
              )
              summary.append(f"{label}: {r.status} {len(r.body)} B {r.elapsed_ms} ms")
              return r


          def next_data(label: str, r):
              m = NEXT.search(r.body)
              if m is None:
                  print(f"[{label}] sin __NEXT_DATA__ :: {head(r.body)}", flush=True)
                  return None
              return json.loads(m.group(1))


          def first_image(results: list) -> str | None:
              for p in results:
                  urls = p.get("mediaUrls") or []
                  if urls:
                      return urls[0]
              return None


          def photo(label: str, url: str | None) -> None:
              """Una foto de producto: ¿el CDN de imágenes responde desde Actions? (solo estado y tamaño)"""
              if url is None:
                  print(f"[{label}] sin URL de foto", flush=True)
                  return
              get(label, url, headers={"Accept": "image/avif,image/webp,image/*;q=0.8,*/*;q=0.5"})


          def robots(label: str, host: str) -> None:
              r = get(label, f"https://{host}/robots.txt")
              if r is not None and r.status == 200:
                  lines = [x.strip() for x in r.body.decode("utf-8", "replace").splitlines() if x.strip()]
                  keep = [x for x in lines if re.match(r"(?i)(user-agent|crawl-delay|sitemap)", x)]
                  print(f"[{label}] {len(lines)} líneas; user-agent/crawl-delay/sitemap: {keep[:8]}", flush=True)


          def homecenter(label: str, path: str) -> str | None:
              r = get(label, f"https://www.homecenter.com.co{path}")
              if r is None or r.status != 200:
                  return None
              nd = next_data(label, r)
              if nd is None:
                  return None
              try:
                  sd = nd["props"]["pageProps"]["searchProps"]["searchData"]
                  res, pg = sd["results"], sd["pagination"]
              except KeyError as exc:
                  print(f"[{label}] estructura distinta, falta {exc}", flush=True)
                  return None
              disc = sum(1 for p in res if any(b.get("type") == "DISCOUNT" for b in p.get("badges", [])))
              print(f"[{label}] resultados={len(res)} paginación={pg} conDescuento={disc}", flush=True)
              for p in res[:3]:
                  prices = [(x.get("type"), x.get("priceWithoutFormatting")) for x in p.get("prices", [])]
                  print(f"[{label}]   {p.get('productId')} {p.get('brand')} | {str(p.get('displayName'))[:48]} | {prices}", flush=True)
              return first_image(res)


          def falabella(label: str, path: str) -> str | None:
              r = get(label, f"https://www.falabella.com.co{path}")
              if r is None or r.status != 200:
                  return None
              nd = next_data(label, r)
              if nd is None:
                  return None
              pp = nd["props"]["pageProps"]
              res, pg = pp.get("results") or [], pp.get("pagination") or {}
              own = sum(1 for p in res if p.get("sellerName") == "Falabella")
              spons = sum(1 for p in res if p.get("isSponsored"))
              badge = sum(1 for p in res if p.get("discountBadge"))
              print(f"[{label}] resultados={len(res)} paginación={pg} propios={own} patrocinados={spons} conInsignia={badge}", flush=True)
              for p in res[:3]:
                  prices = [(x.get("type"), x.get("price")) for x in p.get("prices", [])]
                  print(f"[{label}]   {p.get('productId')} {p.get('brand')} | {str(p.get('displayName'))[:40]} | {p.get('sellerName')} | {prices}", flush=True)
              return first_image(res)


          def vtex(label: str, host: str, query: str) -> None:
              r = get(label, f"https://{host}/api/catalog_system/pub/products/search?ft={query}&_from=0&_to=9")
              data = None
              if r is not None and r.status == 200:
                  try:
                      data = json.loads(r.body)
                  except ValueError:
                      print(f"[{label}] no es JSON :: {head(r.body)}", flush=True)
              if isinstance(data, list):
                  print(f"[{label}] VTEX: lista de {len(data)} productos", flush=True)
                  for p in data[:2]:
                      item = (p.get("items") or [{}])[0]
                      sellers = item.get("sellers") or [{}]
                      offer = sellers[0].get("commertialOffer", {})
                      print(
                          f"[{label}]   {p.get('productId')} {p.get('brand')} | {str(p.get('productName'))[:40]} | "
                          f"Price={offer.get('Price')} stock={offer.get('AvailableQuantity')} vendedores={[s.get('sellerId') for s in sellers]}",
                          flush=True,
                      )
                  return
              home = get(f"{label}/inicio", f"https://{host}/")
              if home is not None and home.status == 200:
                  text = home.body[:600000].decode("utf-8", "replace").lower()
                  found = {k: text.count(k) for k in PLATFORMS if text.count(k)}
                  print(f"[{label}] plataforma por marcas de la portada: {found}", flush=True)


          HC_BIG = "/homecenter-co/category/cat1670400/herramientas-electricas-e-inalambricas/"
          FA_LAP = "/falabella-co/category/cat1361001/Computadores-Portatiles"

          robots("hc/robots", "www.homecenter.com.co")
          hc_photo = homecenter("hc/herramientas-p1", HC_BIG)
          homecenter("hc/herramientas-p2", f"{HC_BIG}?currentpage=2")
          homecenter("hc/herramientas-p150", f"{HC_BIG}?currentpage=150")
          homecenter("hc/destornilladores", "/homecenter-co/category/cat300017/destornilladores-electricos-y-llaves-de-impacto/")
          homecenter("hc/computadores", "/homecenter-co/category/cat370014/computadores-tablets-e-impresoras/")

          robots("fa/robots", "www.falabella.com.co")
          falabella("fa/portatiles-p1", FA_LAP)
          falabella("fa/portatiles-p2", f"{FA_LAP}?page=2")
          fa_photo = falabella("fa/portatiles-propios", f"{FA_LAP}?f.derived.variant.sellerId=FALABELLA")
          falabella("fa/celulares", "/falabella-co/category/cat1660941/Celulares-y-Telefonos")
          falabella("fa/tenis", "/falabella-co/category/cat6360942/Tenis")

          photo("hc/foto", hc_photo)
          photo("fa/foto", fa_photo)

          for code, host, query in (
              ("easy", "www.easy.com.co", "taladro"),
              ("totto", "www.totto.com", "morral"),
              ("nike", "www.nike.com.co", "zapatillas"),
              ("velez", "www.velez.com.co", "zapatos"),
              ("arturocalle", "www.arturocalle.com", "camisa"),
              ("vistronica", "www.vistronica.com", "arduino"),
              ("sigma", "www.sigmaelectronica.net", "resistencia"),
              ("libreria", "librerianacional.com", "cuaderno"),
          ):
              vtex(f"vtex/{code}", host, query)

          print("\n==== RESUMEN ====", flush=True)
          for line in summary:
              print(line, flush=True)
          print("==== FIN ====", flush=True)
          PY
