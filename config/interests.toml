# Intereses de David (spec del perfil §3-§4, ADR 0013): lo que coincide sale en tarjeta aunque
# su tema no esté en `card`, aunque la fuente ya haya enviado sus tarjetas del día y sin el
# precio mínimo del rastreo; sigue exigiendo un descuento real contra el histórico.
#
# Cada interés: `name` (1 a 40 caracteres, sin repetir), `topic` (el tema del grupo bajo el que
# se lista en /interes), `terms` (1 a 10, en español y en inglés) y `exclude` (opcional).
# Un término coincide si sus palabras aparecen seguidas en el título, sin importar mayúsculas,
# tildes ni plural, y empiezan antes del primer «para», «con», «sin», «for», «with» o
# «compatible» («Mochila para portátil» es un morral, no un portátil); `exclude` mira todo el
# título. Un término de una sola palabra necesita al menos 3 letras (en `exclude` sí vale una
# más corta, como «3d»). Si coinciden varios, gana el término con más palabras y, a igual
# largo, el que aparece primero en este archivo (los de /interes van después).
# Los intereses personales se agregan con /interes; los de este archivo se cambian con un PR.

daily_cards_per_interest = 3  # tarjetas por interés al día de Bogotá; lo demás va al resumen

# 📱 Tecnología

[[interests]]
name = "Portátil"
topic = "tecnologia"
# «portátil» solo también es «portable» (cunas, secadores, parlantes) y «notebook», cuaderno.
terms = [
    "computador portatil", "laptop", "macbook", "portatil gamer", "portatil hp", "portatil lenovo",
    "portatil asus", "portatil acer", "portatil dell", "portatil msi",
]
exclude = [
    "funda", "forro", "sleeve", "case", "protector", "sticker", "skin", "soporte", "stand",
    "mochila", "backpack", "maletin", "bag", "base refrigerante", "cooling pad", "cargador",
    "charger",
]

