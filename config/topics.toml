# Tema de las ofertas de los canales de Telegram (spec de canales §4.2). Se comparan con los
# hashtags y las palabras del título (normalizados); gana la regla con más palabras y, a igual
# número, la que va primero. Sin coincidencias van a «Otros».
# Las palabras en inglés son para los feeds de Amazon (títulos y categorías de DealNews y
# Slickdeals). Se dejan fuera las ambiguas: care, smart, watch, accessories, outdoor, o «pc»,
# que en Slickdeals es «piezas» (217-Pc).
[[channel_rules]]
topic = "tecnologia"
words = ["audifonos", "iphone", "celular", "tablet", "laptop", "monitor", "teclado", "raton",
  "mouse", "control", "videojuego", "consola", "smartwatch", "reloj inteligente", "proyector",
  "cargador", "accesoriostecnologia", "board", "ssd", "ps5", "xbox", "switch",
  "headphones", "headphone", "earbuds", "earphones", "airpods", "speaker", "speakers", "keyboard",
  "keyboards", "mice", "laptops", "tablets", "monitors", "phone", "phones", "smartphone", "ipad",
  "macbook", "charger", "chargers", "usb", "bluetooth", "wifi", "router", "drone", "drones",
  "camera", "cameras", "webcam", "printer", "gaming", "nintendo", "playstation", "psu", "gpu",
  "ssds", "hdmi"]

[[channel_rules]]
topic = "electro"
words = ["televisor", "tv", "freidora", "aspiradora", "licuadora", "cafetera",
  "tvs", "television", "vacuum", "vacuums", "fryer", "blender", "microwave", "refrigerator",
