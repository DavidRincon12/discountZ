# Tema de las ofertas de canales de Telegram y feeds de Amazon (spec de canales §4.2).
# Cada término es una palabra o una frase y nombra un solo tema (se comprueba al cargar). Se
# comparan sin tildes y en singular («zapatos» = «zapato», «relojes» = «reloj»):
#   - hashtag: el término entero o, si el hashtag es compuesto, su prefijo más largo
#     («zapatoshombre» → «zapato»; si no hay, el sufijo: «accesorioshogar» → «hogar»). Pesa 2.
#   - título: la frase más larga gana a sus palabras sueltas («reloj inteligente» antes que
#     «reloj»). Pesa 2 hasta el primer «para», «con», «for»… y 1 después («mochila para laptop»).
# Gana el tema con más peso; a igual peso, el que va primero aquí. Sin coincidencias: «Otros».
# Fuera a propósito, por ambiguas: control, board, switch, juego, bolsa, crema, plancha,
# limpiador, protector, portátil, pc (en Slickdeals es «piezas»), watch, care, smart, outdoor.

