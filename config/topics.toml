# Temas del grupo de Telegram y asignación de rutas de categoría (spec del rastreo §6). Sin secretos.
# `category` es la categoría de la v1 que reciben los listings del tema (seguir, silenciar, umbrales).
# Reglas: gana el prefijo más largo; a igual largo, la de la fuente antes que la comodín "*".
# Las rutas se normalizan (minúsculas, sin tildes) antes de comparar.
# `mode` es el perfil de David (spec del perfil §1.1): `card` sale en tarjeta; `interest` se rastrea
# pero solo sale si coincide con un interés (`config/interests.toml` y /interes); `off` no se
# rastrea. Sin `mode`, `card`. En `errores` y `comunidad_us` no aplica: un error de precio sigue el
# modo del tema del producto y las alertas de Slickdeals no pasan por el perfil. Al cambiar un
# `mode`, cambia también `test_load_topics_reads_profile_modes` (tests/unit/test_config.py), que
# fija este perfil.

# Categorías de primer nivel que caen en «Otros» a propósito (servicios, donaciones, internas).
intentional_otros = [
  "exito:/servicios/", "exito:/instrumentos musicales/",
  "carulla:/servicios/", "carulla:/escuela de cocina/", "carulla:/instrumentos musicales/",
  "olimpica:/donaciones/", "olimpica:/otras categorias/",
  "panamericana:/impuestos iva(no utilizar)/",
  "ebay_us:/musical instruments & gear/",
  "alkosto:/servicios/", "alkosto:/pines/", "alkosto:/instrumentos musicales/",
  "jumbo:/bolsa/", "jumbo:/tarjeta regalo/", "jumbo:/logistica/",
  "pepeganga:/gift card/", "pepeganga:/entretenimiento/",
]

[topics.errores]
title = "🔥 Errores de precio"
category = "otros"

[topics.tecnologia]
